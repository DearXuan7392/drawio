name: Build and Deploy

# 当向 dev 分支推送代码（或定时拉取更新到 dev 分支）时触发部署
on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build-and-deploy:
    # 确保只有你自己的 GitHub 账号运行该工作流时才真正执行部署
    if: github.repository_owner == 'DearXuan7392'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Deploy to EdgeOne Pages
        # 直接把包含静态文件的目录（如 ./src/main/webapp）上传到 EdgeOne
        run: npx edgeone pages deploy ./src/main/webapp -n ${{ secrets.EDGEONE_PROJECT_NAME }} -t ${{ secrets.EDGEONE_API_TOKEN }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ secrets.EDGEONE_PROJECT_NAME }}
