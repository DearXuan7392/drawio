name: 每周自动同步上游

on:
  schedule:
    # 每周一的北京时间凌晨 4:00 自动运行一次 (UTC 20:00)
    - cron: '0 20 * * 0'
  workflow_dispatch: # 保留手动触发按钮

jobs:
  native-git-sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出你自己的代码（使用你的 GitHub Token 允许后续推回）
      - name: 检出本地代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 获取完整历史记录

      # 2. 配置 Git 机器人身份（用于合并时生成 Commit 记录）
      - name: 配置 Git 身份
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 3. 检查是否有更新，并在有更新时才进行合并与推送
      - name: 检查上游并自动合并
        run: |
          # 添加官方上游仓库
          git remote add upstream https://github.com/jgraph/drawio.git
          
          # 获取官方最新分支数据
          git fetch upstream dev
          
          # 【精准判定】检查你的 HEAD 到 官方 dev 之间有没有落后 Commit
          # 如果后面有输出，说明官方有新东西；如果为空，说明两边完全同步
          CHANGES=$(git log HEAD..upstream/dev --oneline)
          
          if [ -z "$CHANGES" ]; then
            echo "=============================================="
            echo "🎉 检查完毕：你的仓库已经是最新，官方无新更新！"
            echo "=============================================="
            exit 0
          else
            echo "=============================================="
            echo "🚀 发现官方有新提交，正在合并更新..."
            echo "=============================================="
            
            # 执行合并（如果你的默认分支不是 dev，请将下面这句的 dev 改掉）
            git merge upstream/dev --allow-unrelated-histories -m "chore: 自动化每周同步官方最新代码"
            
            # 推送回你自己的 GitHub 仓库
            git push origin HEAD
            
            echo "✅ 更新已成功同步到你的仓库！"
          fi
